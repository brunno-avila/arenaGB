<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel - Arena GB</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilo.css" rel="stylesheet">
  <link rel="icon" href="img/logo.png">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-md navbar-dark topo">
      <div class="container">
        <a class="navbar-brand" href="index.html"><img src="img/logo-branco.png" alt="" class="logo">ARENA <span>GB</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
          aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
            <li class="nav-item"><a class="nav-link" href="jogos.html">Jogos</a></li>
            <li class="nav-item"><a class="nav-link" href="jogadores.html">Jogadores</a></li>
            <li class="nav-item"><a class="nav-link" href="historico.html">Histórico</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="painel.html">Painel</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-4">
    <h1>Painel</h1>
    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3">
        <div class="numero">
          <span>Total apostado</span>
          <strong id="total-apostado"></strong>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="numero">
          <span>Prêmios pagos</span>
          <strong id="total-premios"></strong>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="numero">
          <span>Lucro da casa</span>
          <strong id="lucro-casa"></strong>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="numero">
          <span>Jogadas</span>
          <strong id="total-jogadas"></strong>
        </div>
      </div>
    </div>

    <h2>Ranking</h2>
    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>#</th>
            <th>Jogador</th>
            <th>Jogadas</th>
            <th>Saldo</th>
          </tr>
        </thead>
        <tbody id="tabela-ranking"></tbody>
      </table>
    </div>
  </main>

  <footer class="rodape">
    <div class="container">Arena GB - Desenvolvimento Web I - UnC. Proibido para MENORES de 18 anos.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/painel.js"></script>
</body>
</html>
