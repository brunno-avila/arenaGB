<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico - Arena GB</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilo.css" rel="stylesheet">
  <link rel="icon" href="img/logo.png">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-md navbar-dark topo">
      <div class="container">
        <a class="navbar-brand" href="index.html"><img src="img/logo-branco.png" alt="" class="logo">ARENA <span>GB</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
          aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
            <li class="nav-item"><a class="nav-link" href="jogos.html">Jogos</a></li>
            <li class="nav-item"><a class="nav-link" href="jogadores.html">Jogadores</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="historico.html">Histórico</a></li>
            <li class="nav-item"><a class="nav-link" href="painel.html">Painel</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-4">
    <h1>Histórico</h1>
    <div class="row g-2 mb-3">
      <div class="col-md-3">
        <input type="search" id="busca" class="form-control" placeholder="Pesquisar jogador" oninput="mostrar_historico()">
      </div>
      <div class="col-md-3">
        <select id="filtro-resultado" class="form-select" onchange="mostrar_historico()">
          <option value="">Todos os resultados</option>
          <option value="ganhou">Ganhou</option>
          <option value="perdeu">Perdeu</option>
        </select>
      </div>
      <div class="col-md-3">
        <select id="filtro-jogo" class="form-select" onchange="mostrar_historico()"></select>
      </div>
      <div class="col-md-3">
        <select id="ordem" class="form-select" onchange="mostrar_historico()">
          <option value="recentes">Mais recentes</option>
          <option value="premio">Maior prêmio</option>
          <option value="aposta">Maior aposta</option>
        </select>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
          <tr>
            <th>Data</th>
            <th>Jogador</th>
            <th>Jogo</th>
            <th>Aposta</th>
            <th>Prêmio</th>
            <th>Resultado</th>
          </tr>
        </thead>
        <tbody id="tabela-historico"></tbody>
      </table>
    </div>
    <p id="contador"></p>
  </main>

  <footer class="rodape">
    <div class="container">Arena GB - Desenvolvimento Web I - UnC. Proibido para MAIORES de 18 anos.div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/historico.js"></script>
</body>
</html>
