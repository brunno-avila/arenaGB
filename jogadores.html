<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogadores - Arena GB</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilo.css" rel="stylesheet">
  <link rel="icon" href="img/logo.png">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-md navbar-dark topo">
      <div class="container">
        <a class="navbar-brand" href="index.html"><img src="img/logo-branco.png" alt="" class="logo">ARENA <span>GB</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
          aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
            <li class="nav-item"><a class="nav-link" href="jogos.html">Jogos</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="jogadores.html">Jogadores</a></li>
            <li class="nav-item"><a class="nav-link" href="historico.html">Histórico</a></li>
            <li class="nav-item"><a class="nav-link" href="painel.html">Painel</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-4">
    <h1>Jogadores</h1>
    <div id="mensagem"></div>

    <div class="row g-4">
      <section class="col-lg-4">
        <div class="caixa">
          <h2 id="titulo-formulario">Novo jogador</h2>
          <form id="form-jogador" novalidate>
            <input type="hidden" id="jogador-id">
            <div class="mb-3">
              <label for="nome" class="form-label">Nome</label>
              <input type="text" id="nome" class="form-control">
            </div>
            <div class="mb-3">
              <label for="idade" class="form-label">Idade</label>
              <input type="number" id="idade" class="form-control">
            </div>
            <div class="mb-3">
              <label for="saldo" class="form-label">Saldo (R$)</label>
              <input type="number" id="saldo" class="form-control" step="0.01">
            </div>
            <button type="submit" class="btn btn-vermelho w-100" id="botao-salvar">Cadastrar</button>
            <button type="button" class="btn btn-preto w-100 mt-2 d-none" id="botao-cancelar" onclick="limpar_formulario()">Cancelar edição</button>
          </form>
        </div>
      </section>

      <section class="col-lg-8">
        <div class="row g-2 mb-3">
          <div class="col-md-5">
            <input type="search" id="busca" class="form-control" placeholder="Pesquisar nome" oninput="mostrar_jogadores()">
          </div>
          <div class="col-md-3">
            <select id="filtro-status" class="form-select" onchange="mostrar_jogadores()">
              <option value="">Todos</option>
              <option value="pendente">Pendente</option>
              <option value="ativo">Ativo</option>
              <option value="bloqueado">Bloqueado</option>
            </select>
          </div>
          <div class="col-md-4">
            <select id="ordem" class="form-select" onchange="mostrar_jogadores()">
              <option value="nome">Nome</option>
              <option value="saldo">Maior saldo</option>
            </select>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Saldo</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tabela-jogadores"></tbody>
          </table>
        </div>
      </section>
    </div>

    <div class="modal fade" id="modal-exclusao" tabindex="-1" aria-labelledby="titulo-exclusao" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="titulo-exclusao">Excluir</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body" id="texto-exclusao"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-preto" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-vermelho" onclick="confirmar_exclusao()">Excluir</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="rodape">
    <div class="container">Arena GB - Desenvolvimento Web I - UnC. Proibido para MAIORES de 18 anos. Créditos fictícios.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/jogadores.js"></script>
</body>
</html>
